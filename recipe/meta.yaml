{% set name = "graspologic-native" %}
{% set version = "1.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/graspologic_native-{{ version }}.tar.gz
  sha256: fa6be9c292508b8a876d45ac98ee550534d9e33fcf7129a6df8a95573101be4c

build:
  script:
    - cargo bundle-licenses --format yaml --output THIRDPARTY.yml
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - cargo-bundle-licenses
    - python                     # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - maturin >=1.4,<2.0                     # [build_platform != target_platform]
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
    - {{ compiler("rust") }}
  host:
    - pip
    - python
    - maturin >=1.4,<2.0
  run:
    - python

test:
  imports:
    - graspologic_native
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/microsoft/graspologic-native
  summary: Python native companion module to the graspologic library
  license: MIT
  license_file:
    - THIRDPARTY.yml
    - LICENSE.txt

extra:
  recipe-maintainers:
    - johandahlberg
    - fbdtemme
    - bdpedigo
    - ambarrio
